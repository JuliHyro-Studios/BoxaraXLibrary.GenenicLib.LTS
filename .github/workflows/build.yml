name: Build and Publish LTS

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project (Release Mode)
        run: dotnet build -c Release --no-restore
      - name: Pack NuGet Package
        run: dotnet pack -c Release --no-build -o output_packages

      - name: Push to GitHub Packages & NuGet.org
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "./output_packages/*.nupkg" --source github --skip-duplicate
          dotnet nuget push "./output_packages/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
      # - name: Sign Binaries with SignPath
      #   uses: SignPath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: 'boxaraxlibrary-geneniclib-lts'
      #     signing-policy-slug: 'release-signing'
      #     github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet.org via Trusted Publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json
