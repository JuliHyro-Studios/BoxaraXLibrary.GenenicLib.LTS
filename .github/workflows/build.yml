name: Build, Sign and Publish LTS

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-sign:
    runs-on: windows-latest # Khuyên dùng Windows runner để thao tác với .NET và SignPath mượt mà nhất

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project (Release Mode)
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack -c Release --no-build -o ./artifacts

      # ==========================================================
      # BƯỚC NÀY SẼ KÝ SỐ TỰ ĐỘNG KHI SIGNPATH DUYỆT XONG XUÔI!
      # ==========================================================
      - name: Sign Binaries with SignPath
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'boxaraxlibrary-geneniclib-lts'
          signing-policy-slug: 'release-signing' 
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-path: './artifacts/*.dll'

      - name: Publish to NuGet.org (Chỉ chạy khi đẩy Tag v* lên GitHub)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
