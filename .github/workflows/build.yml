name: Build and Publish LTS

on:
  release:
    types: [published]
  push:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack -c Release --no-build -o output_packages

      # ==========================================
      # FUTURE SIGNPATH INTEGRATION PLACEHOLDER
      # ==========================================
      # - name: Sign NuGet Package with SignPath
      #   shell: pwsh
      #   run: |
      #     Write-Host "SignPath code signing placeholder ready for future use."
      #     # Add SignPath CLI submission scripts here when needed.

      - name: Finalize Artifacts
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem -Path "output_packages/*.nupkg" -Recurse | Select-Object -First 1).FullName
          if (-not $pkg) {
              Write-Error "Package not found!"
              exit 1
          }
          Write-Host "Build and packaging completed successfully for: $pkg"
