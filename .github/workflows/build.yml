name: Build and Publish LTS

on:
  release:
    types: [published]
  push:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack -c Release --no-build -o output_packages

      - name: Publish to Registries
        shell: pwsh
        run: |
          dotnet nuget add source --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          $pkg = (Get-ChildItem -Path "output_packages/*.nupkg" -Recurse | Select-Object -First 1).FullName

          if (-not $pkg) {
              Write-Error "Package not found!"
              exit 1
          }

          Write-Host "Pushing to GitHub Packages..."
          dotnet nuget push "$pkg" --source github --skip-duplicate

          Write-Host "Pushing to NuGet.org via Trusted Publishing (OIDC)..."
          dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
