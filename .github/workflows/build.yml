name: Build and Publish LTS

on:
  release:
    types: [published]
  push:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack -c Release --no-build -o output_packages

      - name: Publish to Registries via Ultimate OIDC Fallback Loop
        shell: pwsh
        run: |
          dotnet nuget add source --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          $pkg = (Get-ChildItem -Path "output_packages/*.nupkg" -Recurse | Select-Object -First 1).FullName

          if (-not $pkg) {
              Write-Error "CRITICAL: Package not found anywhere!"
              exit 1
          }

          Write-Host "Pushing to GitHub Packages..."
          $ghSuccess = $false
          for ($i = 1; $i -le 3; $i++) {
              try {
                  dotnet nuget push "$pkg" --source github --skip-duplicate
                  if ($LASTEXITCODE -eq 0) {
                      $ghSuccess = $true
                      break
                  }
              } catch {
                  Write-Warning "Attempt $i failed for GitHub Packages, retrying..."
              }
              Start-Sleep -Seconds 5
          }

          Write-Host "Pushing to NuGet.org via Trusted Publishing (OIDC) v3 API..."
          $env:NuGet_Acknowledge_No_API_Key = "true"
          
          for ($i = 1; $i -le 3; $i++) {
              Write-Host "Attempt $i using NuGet v3 API endpoint..."
              dotnet nuget push "$pkg" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Successfully published to NuGet.org!"
                  break
              }
              Start-Sleep -Seconds 5
          }

          if (-not $nugetSuccess) {
              Write-Error "CRITICAL: Failed to push to NuGet.org after 5 exhaustive fallback layers!"
              exit 1
          }
