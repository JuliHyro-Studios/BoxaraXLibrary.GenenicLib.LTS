name: Build and Publish LTS

on:
  release:
    types: [published]
  push:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack -c Release --no-build -o output_packages

      - name: Force NuGet.config v3 Binding and Push
        shell: pwsh
        run: |
          # Tạo file NuGet.config ép buộc tuyệt đối chỉ xài v3, cấm tiệt v2
          $nugetConfig = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="github" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
              <packageSource key="github">
                <package pattern="BoxaraXLibrary.*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          "@
          
          Set-Content -Path "NuGet.config" -Value $nugetConfig
          Write-Host "Created strict v3 NuGet.config successfully."

          $pkg = (Get-ChildItem -Path "output_packages/*.nupkg" -Recurse | Select-Object -First 1).FullName

          if (-not $pkg) {
              Write-Error "Package not found!"
              exit 1
          }

          Write-Host "Pushing to GitHub Packages..."
          dotnet nuget push "$pkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

          Write-Host "Pushing to NuGet.org via strict v3 OIDC..."
          $env:NuGet_Acknowledge_No_API_Key = "true"
          
          for ($i = 1; $i -le 5; $i++) {
              Write-Host "Strict v3 Push Attempt $i..."
              dotnet nuget push "$pkg" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Successfully published to NuGet.org via v3 OIDC!"
                  break
              }
              Start-Sleep -Seconds 5
          }
